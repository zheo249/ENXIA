<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Predictor</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <main>
        <h1>Student Performance Predictor</h1>
        <p class="introduction">Manage students and explore a fictional teaching-only grade prediction.</p>

        <!-- Pestañas: cada botón muestra su panel (data-tab) y oculta los demás -->
        <nav class="tabs" role="tablist" aria-label="Secciones">
            <button type="button" class="tab-button active" role="tab" id="tab-btn-students"
                    data-tab="students" aria-controls="tab-students" aria-selected="true">Students</button>
            <button type="button" class="tab-button" role="tab" id="tab-btn-subjects"
                    data-tab="subjects" aria-controls="tab-subjects" aria-selected="false">Subjects</button>
            <button type="button" class="tab-button" role="tab" id="tab-btn-courses"
                    data-tab="courses" aria-controls="tab-courses" aria-selected="false">Courses</button>
        </nav>

        <div id="tab-students" class="tab-panel" role="tabpanel" aria-labelledby="tab-btn-students">
        <section class="panel">
            <h2 id="form-title">Add student</h2>
            <form id="student-form">
                <input id="student-id" type="hidden">
                <label for="student-name">Name</label>
                <input id="student-name" type="text" required>

                <label for="study-hours">General study hours</label>
                <input id="study-hours" type="number" min="0" step="0.5" value="0" required>

                <fieldset class="subjects-fieldset">
                    <legend>Subjects &amp; study hours (HU-04)</legend>
                    <div id="student-subjects-container">
                        <p class="muted">No subjects available yet.</p>
                    </div>
                </fieldset>

                <div class="form-actions">
                    <button type="submit">Save student</button>
                    <button id="cancel-edit" class="secondary hidden" type="button">Cancel edit</button>
                </div>
            </form>
            <p id="message" role="status"></p>
        </section>

        <section class="panel">
            <h2>Students</h2>
            <div id="student-list"></div>
        </section>
        </div>

        <div id="tab-subjects" class="tab-panel hidden" role="tabpanel" aria-labelledby="tab-btn-subjects">
        <section class="panel">
            <h2>Add subject</h2>
            <form id="subject-form">
                <label for="subject-name">Name</label>
                <input id="subject-name" type="text" required>

                <label for="subject-difficulty">Difficulty</label>
                <select id="subject-difficulty" required>
                    <option value="">-- Select --</option>
                    <option value="EASY">Fácil</option>
                    <option value="MEDIUM">Media</option>
                    <option value="HARD">Difícil</option>
                </select>

                <div class="form-actions">
                    <button type="submit">Save subject</button>
                </div>
            </form>
            <p id="subject-message" role="status"></p>
        </section>

        <section class="panel">
            <h2>Subjects</h2>
            <div id="subject-list"></div>
        </section>
        </div>

        <div id="tab-courses" class="tab-panel hidden" role="tabpanel" aria-labelledby="tab-btn-courses">
        <section class="panel">
            <h2 id="course-form-title">Add academic course</h2>
            <form id="course-form">
                <input id="course-id" type="hidden">
                <label for="course-name">Name (e.g. 2025/2026)</label>
                <input id="course-name" type="text" maxlength="50" required>

                <label for="course-start-date">Start date</label>
                <input id="course-start-date" type="date" required>

                <label for="course-end-date">End date</label>
                <input id="course-end-date" type="date" required>

                <div class="form-actions">
                    <button type="submit">Save course</button>
                    <button id="cancel-course-edit" class="secondary hidden" type="button">Cancel edit</button>
                </div>
            </form>
            <p id="course-message" role="status"></p>
        </section>

        <section class="panel">
            <h2>Academic courses</h2>
            <div id="course-list"></div>
        </section>
        </div>
    </main>
    <script src="/app.js"></script>
</body>
</html>
